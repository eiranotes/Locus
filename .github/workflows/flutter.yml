name: Flutter CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Generate platform wrappers
        run: ./tool/bootstrap_platforms.sh
      - name: Resolve packages
        run: flutter pub get
      - name: Apply first analyzer fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected source fragment not found')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'lib/src/app/app_controller.dart',
              '  Future<void> initialize() async {',
              '  void notifyChanged() => notifyListeners();\n\n  Future<void> initialize() async {',
          )
          actions = Path('lib/src/app/app_controller_actions.dart')
          actions.write_text(
              actions.read_text(encoding='utf-8').replace(
                  'notifyListeners();',
                  'notifyChanged();',
              ),
              encoding='utf-8',
          )
          replace(
              'lib/src/diorama/diorama_game.dart',
              '  void render(Canvas canvas) {\n    DioramaScenePainter(_snapshot).paint(canvas, Size(size.x, size.y));\n  }',
              '  void render(Canvas canvas) {\n    super.render(canvas);\n    DioramaScenePainter(_snapshot).paint(canvas, Size(size.x, size.y));\n  }',
          )
          replace(
              'lib/src/diorama/diorama_game.dart',
              'const Rect.fromCircle(center: Offset(180, 180), radius: 180)',
              'Rect.fromCircle(center: const Offset(180, 180), radius: 180)',
          )
          replace(
              'lib/src/ui/screens/capture_sheet.dart',
              '    if (include) {\n      include = await _requestBluetoothPermission();\n    }\n    setState(() => _capturing = true);',
              '    if (include) {\n      include = await _requestBluetoothPermission();\n    }\n    if (!mounted) {\n      return;\n    }\n    setState(() => _capturing = true);',
          )
          codex = Path('lib/src/ui/screens/codex_screen.dart')
          codex.write_text(
              codex.read_text(encoding='utf-8').replace(
                  "import 'package:reality_diorama/src/domain/enums.dart';\n",
                  '',
              ),
              encoding='utf-8',
          )
          for path in (
              'lib/src/ui/screens/home_screen.dart',
              'lib/src/ui/screens/placement_editor_screen.dart',
          ):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              import_line = "import 'package:reality_diorama/src/domain/enums.dart';\n"
              if import_line not in text:
                  anchor = "import 'package:reality_diorama/src/domain/entities.dart';\n"
                  if anchor not in text:
                      raise SystemExit(f'{path}: entity import anchor not found')
                  text = text.replace(anchor, anchor + import_line)
                  file.write_text(text, encoding='utf-8')
          Path('test/widget_test.dart').write_text(
              """import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            testWidgets('basic Flutter smoke test', (WidgetTester tester) async {
              await tester.pumpWidget(
                const MaterialApp(home: Scaffold(body: Text('Locus'))),
              );
              expect(find.text('Locus'), findsOneWidget);
            });
          }
          """,
              encoding='utf-8',
          )
          PY
          dart format lib test
          git add lib test
          if git diff --cached --quiet; then
            echo 'Analyzer fixes already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: resolve initial Flutter analyzer errors'
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Repository contracts
        run: python3 tool/check_repo.py
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=DEMO_MODE=true --no-pub

  ios-compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - name: Generate platform wrappers
        run: ./tool/bootstrap_platforms.sh
      - name: Resolve packages
        run: flutter pub get
      - name: Build iOS simulator
        run: flutter build ios --simulator --debug --dart-define=DEMO_MODE=true --no-pub
