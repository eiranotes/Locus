name: Actions heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record one-time heartbeat
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/ACTIONS_HEARTBEAT ]]; then
            exit 0
          fi
          printf 'GitHub Actions scheduler reached this repository.\n' > .github/ACTIONS_HEARTBEAT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/ACTIONS_HEARTBEAT
          git commit -m 'ci: record Actions heartbeat'
          git push origin HEAD:main
