name: Bootstrap Flutter source

on:
  push:
    branches:
      - agent/import-flutter-mvp
    paths:
      - bootstrap/source.tar.gz.b64

permissions:
  contents: write

concurrency:
  group: bootstrap-flutter-source
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and extract source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/source.tar.gz.b64
          base64 --decode bootstrap/source.tar.gz.b64 > "$RUNNER_TEMP/locus-source.tar.gz"
          tar -tzf "$RUNNER_TEMP/locus-source.tar.gz" > "$RUNNER_TEMP/locus-source-files.txt"
          if grep -E '(^|/)\.git(/|$)' "$RUNNER_TEMP/locus-source-files.txt"; then
            echo 'Archive unexpectedly contains Git metadata.' >&2
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/locus-source.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -f bootstrap/source.tar.gz.b64
          rmdir bootstrap 2>/dev/null || true

      - name: Validate imported repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/check_repo.py
          bash -n tool/bootstrap_platforms.sh
          bash -n tool/create_source_archive.sh
          bash -n tool/publish_github.sh
          bash -n tool/validate.sh

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import Flutter reality diorama MVP'
          git push origin "HEAD:${GITHUB_REF_NAME}"
