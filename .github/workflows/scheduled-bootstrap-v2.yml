name: Scheduled Flutter source bootstrap v2

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-flutter-source-bootstrap-v2
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-flutter-mvp
          fetch-depth: 0

      - name: Import source without changing workflow files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml ]]; then
            echo 'Flutter source is already imported.'
            exit 0
          fi
          test -f bootstrap/READY
          parts=(
            bootstrap/source.part-00
            bootstrap/source.part-01a
            bootstrap/source.part-01b
            bootstrap/source.part-02
            bootstrap/source.part-03a
            bootstrap/source.part-03b1
            bootstrap/source.part-03b2
            bootstrap/source.part-04
            bootstrap/source.part-05
            bootstrap/source.part-06
            bootstrap/source.part-07
          )
          for part in "${parts[@]}"; do test -f "$part"; done
          cat "${parts[@]}" > "$RUNNER_TEMP/locus-source.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/locus-source.tar.gz.b64" > "$RUNNER_TEMP/locus-source.tar.gz"
          echo 'fc941aed2a65fef1eea06b8f8bdd51905506f304de6c3c5b2440db8b9d227d1e  '"$RUNNER_TEMP/locus-source.tar.gz" | sha256sum --check --status
          tar -tzf "$RUNNER_TEMP/locus-source.tar.gz" > "$RUNNER_TEMP/locus-source-files.txt"
          if grep -E '(^|/)\.git(/|$)' "$RUNNER_TEMP/locus-source-files.txt"; then
            echo 'Archive unexpectedly contains Git metadata.' >&2
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/locus-source.tar.gz" -C "$GITHUB_WORKSPACE"
          python3 tool/check_repo.py
          bash -n tool/bootstrap_platforms.sh
          bash -n tool/create_source_archive.sh
          bash -n tool/publish_github.sh
          bash -n tool/validate.sh

          # A GITHUB_TOKEN push can be rejected when the same commit adds a workflow.
          # Register the production CI workflow separately through the GitHub connector.
          rm -f .github/workflows/flutter-ci.yml
          rm -rf bootstrap

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Flutter reality diorama MVP'
          git push origin HEAD:agent/import-flutter-mvp
