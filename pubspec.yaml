name: reality_diorama
description: A local-first reality collection and pixel diorama crafting game for iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  geolocator: ^14.0.3
  http: ^1.6.0
  path: ^1.9.1
  permission_handler: ^12.0.3
  sqflite: ^2.4.3
  uuid: ^4.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/content/
    - assets/art/
    - assets/art/generated/v1/
